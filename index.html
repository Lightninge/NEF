<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEF Team Dashboard</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6fa;--card:#fff;--text:#1c1f2a;--mute:#667085;--line:#e3e6ee;--accent:#5865f2;--accent-t:#fff;--ok:#1a7f4b;--warn:#b54708;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151c;--card:#1e2029;--text:#eceef5;--mute:#9aa1b5;--line:#2e3140;--ok:#4cc38a;--warn:#f0a23b;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#14151c;--card:#1e2029;--text:#eceef5;--mute:#9aa1b5;--line:#2e3140;--ok:#4cc38a;--warn:#f0a23b;--bad:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:1000px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:700;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:8px;color:var(--mute);text-decoration:none;font-weight:600}
nav a.on{background:var(--accent);color:var(--accent-t)}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:24px 0 10px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
img.av{object-fit:cover;background:var(--line)}
.av.lg{width:64px;height:64px;font-size:26px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.lead{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button,select,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer;font-weight:600}button.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button.dng{color:var(--bad);border-color:var(--bad)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-size:13px}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.empty{padding:18px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}
.banner{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:16px;font-size:13px}
code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:9}
.login{max-width:420px;margin:12vh auto;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
/* ---- Config: set API_BASE to your backend (e.g. https://teams.example.com) for live mode. ----
   Live mode expects: GET /api/me, GET /api/teams, GET /api/events (SSE), POST /api/leader/remove,
   login at /auth/discord. All authorization is enforced server-side; this UI only hides controls. */
const CFG = Object.assign({ API_BASE: "", LIVE: true }, window.NEF_CONFIG || {}); // API_BASE comes from config.js when hosted on GitHub Pages
const DEMO = !CFG.LIVE;
const STAT_DEFS = [ // add new metrics here; they appear on profiles and team pages automatically
  { key: "played", label: "Games played" }, { key: "wins", label: "Wins" }, { key: "draws", label: "Draws" }, { key: "losses", label: "Losses" },
  { key: "winrate", label: "Win rate", derive: s => s.played ? Math.round(100 * s.wins / s.played) + "%" : null }
];
const COLORS = ["#5865f2","#2f9e6f","#d9822b","#c2478b","#3b82c4","#8a5cd0"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const $ = id => document.getElementById(id);

let S = { me: null, route: "player", users: {}, teams: [], invites: [], audit: [], sync: {}, ready: false, guild: null, guilds: [], guildInfo: null, message: "", super: null, lb: null, lbMetric: null, lbTeam: "", lbLimit: 10, lbError: "" };

function demoData() {
  const names = { u1:"Ava", u2:"Ben", u3:"Chen", u4:"Dara", u5:"Eli", u9:"Admin Zed" };
  S.users = {};
  Object.entries(names).forEach(([id, n], i) => S.users[id] = { id, name: n, color: COLORS[i % 6], admin: id === "u9",
    stats: id === "u1" ? { played: 24, wins: 15, losses: 9 } : id === "u2" ? { played: 18, wins: 9, losses: 9 } : id === "u4" ? { played: 12, wins: 8, losses: 4 } : null });
  S.teams = [
    { id: "1101", name: "Team Alpha", leader: "u1", members: ["u1","u2","u3"] },
    { id: "1102", name: "Team Bravo", leader: "u4", members: ["u4","u5"] },
    { id: "1103", name: "Team Gamma", leader: null, members: [] }];
  S.invites = [{ id: "i1", team: "1101", user: "Frey", by: "u1", status: "pending", exp: "in 23 h" },
    { id: "i2", team: "1102", user: "Ben", by: "u4", status: "denied", exp: "—" }];
  S.audit = [{ t: "10:02", msg: "Role sync completed (3 teams)" }, { t: "09:40", msg: "u4 invited Ben to Team Bravo (denied)" }];
  S.sync = { last: "just now", gateway: "connected", errors: 0 };
}
const log = m => { S.audit.unshift({ t: new Date().toTimeString().slice(0, 5), msg: m }); };
const teamOf = uid => S.teams.find(t => t.members.includes(uid));
const lead = uid => S.teams.find(t => t.leader === uid);
const toast = m => { const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 2200); };
const av = (u, lg) => u.avatar ? `<img class="av${lg ? " lg" : ""}" src="${esc(u.avatar)}" alt="" referrerpolicy="no-referrer">` : `<div class="av${lg ? " lg" : ""}" style="background:${u.color}">${esc(u.name[0])}</div>`;
const nm = id => S.users[id] ? esc(S.users[id].name) : "—";

// built-in metrics + the custom statistics each server defines with /nef definestat
const allDefs = () => STAT_DEFS.concat((S.statdefs || []).map(d => ({ key: d.key, label: d.label })));
function statTiles(s) {
  if (!s) return `<div class="empty">No statistics recorded yet. Add a data source or call <code>POST /api/stats</code> with a metric payload to start tracking.</div>`;
  return `<div class="grid">${allDefs().map(d => { const v = d.derive ? d.derive(s) : s[d.key]; return v == null ? "" : `<div class="card stat"><b>${esc(v)}</b><span>${d.label}</span></div>`; }).join("")}${Object.keys(s).filter(k => !allDefs().some(d => d.key === k)).map(k => `<div class="card stat"><b>${esc(s[k])}</b><span>${esc(k.replace(/_/g, " "))}</span></div>`).join("")}</div>`;
}
function teamAgg(t) {
  const m = t.members.map(i => S.users[i] && S.users[i].stats).filter(Boolean);
  if (!m.length) return null;
  return m.reduce((a, s) => ({ played: a.played + (s.played || 0), wins: a.wins + (s.wins || 0), losses: a.losses + (s.losses || 0) }), { played: 0, wins: 0, losses: 0 });
}
const link = (r, txt) => `<a class="lnk" href="#${r}">${txt}</a>`;

function viewPlayer() {
  const u = S.me, t = teamOf(u.id), l = lead(u.id);
  return `<h1>Player dashboard</h1><p class="sub">Synced from your Discord roles.</p>
  <div class="card row">${av(u, 1)}<div><b style="font-size:18px">${esc(u.name)}</b><br>
  ${t ? `<span class="tag">${esc(t.name)}</span>` : `<span class="tag">No team</span>`}
  ${l ? `<span class="tag lead">Team leader</span>` : ""}${u.admin ? `<span class="tag warn">Administrator</span>` : ""}</div></div>
  <h2>Statistics</h2>${statTiles(u.stats)}
  <h2>Team</h2>${t ? `<div class="card">${link("t" + t.id, esc(t.name))} · ${t.members.length} members · Leader: ${nm(t.leader)}</div>` : `<div class="empty">You’re not on a team yet. Ask a team leader to run <code>nef inviteplayer</code>.</div>`}`;
}
function viewTeams() {
  if (!S.teams.length) return `<h1>Teams</h1><div class="empty">No team roles detected on the server.</div>`;
  return `<h1>Teams</h1><p class="sub">One team per Discord role. Create or delete a role in Discord and this list follows.</p>
  <div class="card scroll"><table><tr><th>Team</th><th>Leader</th><th>Members</th><th>Games</th></tr>
  ${S.teams.map(t => { const a = t.stats || teamAgg(t); return `<tr><td>${link("t" + t.id, esc(t.name))}</td><td>${nm(t.leader)}</td><td>${t.members.length}</td><td>${a ? a.played : "—"}</td></tr>`; }).join("")}</table></div>`;
}
function viewTeam(id) {
  const t = S.teams.find(x => x.id === id);
  if (!t) return `<h1>Team not found</h1><div class="empty">This team role no longer exists. ${link("teams", "Back to teams")}</div>`;
  const a = t.stats || teamAgg(t);
  const res = (t.results || []).length ? `<div class="card scroll"><table><tr><th>#</th><th>Date</th><th>Opponent</th><th>Result</th><th>Score</th></tr>${t.results.map(x => `<tr><td>${esc(x.id)}</td><td>${esc(x.date)}</td><td>${esc(x.opponent)}</td><td><span class="tag ${x.result === "win" ? "ok" : x.result === "loss" ? "bad" : "warn"}">${esc(x.result)}</span></td><td>${esc(x.score || "—")}</td></tr>`).join("")}</table></div>` : `<div class="empty">No results recorded yet. Team leaders record them in Discord with <code>/nef result</code>.</div>`;
  return `<h1>${esc(t.name)}</h1><p class="sub">Role ID ${esc(t.id)} · Leader: ${nm(t.leader)}</p>
  <h2>Team statistics</h2>${statTiles(a)}
  <h2>Recent results</h2>${res}
  <h2>Members</h2>${t.members.length ? `<div class="card scroll"><table><tr><th>Player</th><th>Role</th>${allDefs().map(d => `<th>${d.label}</th>`).join("")}</tr>
  ${t.members.map(i => { const u = S.users[i] || { name: "Unknown", color: "#888" }, s = u.stats; return `<tr><td><div class="row">${av(u)}${esc(u.name)}</div></td><td>${t.leader === i ? `<span class="tag lead">Leader</span>` : "Member"}</td>
  ${allDefs().map(d => `<td>${s ? (d.derive ? d.derive(s) : s[d.key]) ?? "—" : "—"}</td>`).join("")}</tr>`; }).join("")}</table></div>` : `<div class="empty">No members.</div>`}`;
}
function viewLeader() {
  const t = lead(S.me.id);
  if (!t) return `<h1>Leader dashboard</h1><div class="empty">You need a team role plus the <code>Team-Leader</code> role to use this page.</div>`;
  const inv = S.invites.filter(i => i.team === t.id);
  return `<h1>Leader dashboard · ${esc(t.name)}</h1><p class="sub">You can only manage this team.</p>
  <div class="card"><b>Invite a player</b><p class="sub">Discord: <code>nef inviteplayer @Player ${esc(t.name)}</code></p>
  <div class="row"><input id="inv" placeholder="Discord username" maxlength="32"><button class="pri" data-act="invite">Create invitation</button></div></div>
  <h2>Members</h2><div class="card scroll"><table>${t.members.map(i => `<tr><td>${nm(i)}</td><td>${i === t.leader ? "Leader" : "Member"}</td>
  <td>${i === t.leader ? "" : `<button class="dng" data-act="remove" data-id="${i}">Remove</button>`}</td></tr>`).join("")}</table></div>
  <h2>Invitations</h2>${inv.length ? `<div class="card scroll"><table>${inv.map(i => `<tr><td>${esc(i.user)}</td><td><span class="tag ${i.status === "pending" ? "warn" : i.status === "accepted" ? "ok" : "bad"}">${i.status}</span></td><td>expires ${i.exp}</td></tr>`).join("")}</table></div>` : `<div class="empty">No invitations yet.</div>`}`;
}
function viewAdmin() {
  if (!S.me.admin) return `<h1>Administrator</h1><div class="empty">Access denied. Admin permission is verified server-side.</div>`;
  return `<h1>Administrator</h1>
  <div class="grid"><div class="card stat"><b>${S.teams.length}</b><span>Detected teams</span></div>
  <div class="card stat"><b>${esc(S.sync.gateway)}</b><span>Gateway</span></div>
  <div class="card stat"><b>${esc(S.sync.last)}</b><span>Last reconcile</span></div>
  <div class="card stat"><b>${S.sync.errors}</b><span>Sync errors</span></div></div>
  ${(S.sync.problems || []).map(p => `<div class="banner">${esc(p)}</div>`).join("")}
  ${DEMO ? `<h2>Demo tools</h2><button data-act="sim">Simulate Discord role create / delete</button>` : ""}
  <h2>Invitations</h2><div class="card scroll"><table>${S.invites.map(i => `<tr><td>${esc(i.user)}</td><td>${esc((S.teams.find(t => t.id === i.team) || { name: "(deleted)" }).name)}</td><td>${i.status}</td></tr>`).join("")}</table></div>
  <h2>Audit log</h2><div class="card scroll"><table>${S.audit.map(a => `<tr><td>${a.t}</td><td>${esc(a.msg)}</td></tr>`).join("")}</table></div>`;
}
function guildPicker() {
  if (DEMO || !S.guilds.length) return "";
  return `<select id="guildsel" aria-label="Server">${S.guilds.map(g => `<option value="${esc(g.id)}"${g.id === S.guild ? " selected" : ""}>${esc(g.name)}${g.enabled ? "" : " (disabled)"}</option>`).join("")}</select>`;
}
function viewLeaderboard() {
  if (S.lbError) return `<h1>Leaderboard</h1><div class="empty">${esc(S.lbError)}</div>`;
  const d = S.lb;
  if (!d) return `<h1>Leaderboard</h1><p class="sub">Loading…</p>`;
  const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(l)}</option>`;
  const medal = r => r === 1 ? "🥇" : r === 2 ? "🥈" : r === 3 ? "🥉" : r;
  const val = e => esc(e.value) + (d.metric === "winrate" ? "%" : "");
  const row = (e, mine) => `<tr${mine || e.id === S.me.id ? ' style="font-weight:700"' : ""}><td>${medal(e.rank)}</td><td><div class="row">${av(e)}${esc(e.name)}</div></td>
    <td>${e.team ? link("t" + e.team.id, esc(e.team.name)) : "—"}</td><td>${val(e)}</td></tr>`;
  return `<h1>Leaderboard</h1><p class="sub">${esc(d.label)} · ${d.team ? "this team" : "whole server"} · ${d.total} ranked</p>
  <div class="row" style="flex-wrap:wrap;margin-bottom:14px">
    <select id="lbmetric" aria-label="Statistic">${d.metrics.map(m => opt(m.key, m.label, m.key === d.metric)).join("")}</select>
    <select id="lbteam" aria-label="Team">${opt("", "Whole server", !d.team)}${d.teams.map(t => opt(t.id, t.name, t.id === d.team)).join("")}</select>
    <select id="lblimit" aria-label="Rows">${[10, 25].map(n => opt(n, "Top " + n, n === S.lbLimit)).join("")}</select>
  </div>
  ${d.entries.length ? `<div class="card scroll"><table><tr><th>#</th><th>Player</th><th>Team</th><th>${esc(d.label)}</th></tr>${d.entries.map(e => row(e)).join("")}
  ${d.me ? `<tr><td colspan="4" style="color:var(--mute);text-align:center">…</td></tr>${row(d.me, true)}` : ""}</table></div>`
  : `<div class="empty">Nobody has a value for this statistic yet. Team leaders record results and stats in Discord with <code>/nef result</code> and <code>/nef addstat</code>.</div>`}
  ${d.note ? `<p class="sub" style="margin-top:10px">${esc(d.note)}</p>` : ""}`;
}
function viewNoGuild() {
  return `<h1>No server available</h1><div class="empty">${esc(S.message || "You're not in any server that uses this bot.")}<br>Ask a server admin to run <code>/nef setup</code>, or join a server that uses NEF.</div>`;
}
function viewSuper() {
  if (!S.me.superadmin) return `<h1>Super admin</h1><div class="empty">Access denied.</div>`;
  const d = S.super;
  if (!d) return `<h1>Super admin</h1><p class="sub">Loading…</p>`;
  const btn = (g, op, label, cls = "") => `<button class="${cls}" data-act="superact" data-op="${op}" data-id="${esc(g.id)}">${label}</button>`;
  return `<h1>Super admin</h1><p class="sub">Every server that uses your bot. Only you can see this page.</p>
  <div class="grid"><div class="card stat"><b>${d.guilds.length}</b><span>Servers</span></div>
  <div class="card stat"><b>${d.guilds.filter(g => g.configured).length}</b><span>Set up</span></div>
  <div class="card stat"><b>${d.guilds.reduce((a, g) => a + g.pending, 0)}</b><span>Pending invitations</span></div>
  <div class="card stat"><b>${d.errors}</b><span>Sync errors</span></div></div>
  <h2>Servers</h2>${d.guilds.length ? `<div class="card scroll"><table><tr><th>Server</th><th>Members</th><th>Teams</th><th>Pending</th><th>Status</th><th>Added</th><th></th></tr>
  ${d.guilds.map(g => `<tr><td><a class="lnk" data-act="opengd" data-id="${esc(g.id)}">${esc(g.name)}</a></td><td>${g.members}</td><td>${g.teams}</td><td>${g.pending}</td>
  <td><span class="tag ${!g.enabled ? "bad" : g.configured ? "ok" : "warn"}">${!g.enabled ? "disabled" : g.configured ? "active" : "not set up"}</span></td><td>${esc(g.joined)}</td>
  <td>${g.enabled ? btn(g, "disable", "Disable") : btn(g, "enable", "Enable", "pri")} ${btn(g, "leave", "Leave", "dng")}</td></tr>`).join("")}</table></div>` : `<div class="empty">The bot isn't in any server yet.</div>`}
  <h2>All activity</h2><div class="card scroll"><table>${d.audit.map(a => `<tr><td>${esc(a.t)}</td><td>${esc(a.server)}</td><td>${esc(a.msg)}</td></tr>`).join("")}</table></div>`;
}
function viewLogin() {
  return `<div class="login card"><h1>NEF Team Dashboard</h1><p class="sub">Sign in with Discord to see your profile, team and statistics.</p>
  ${DEMO ? `<div class="banner">Preview mode: sample data, no backend connected.</div><button class="pri" data-act="login" data-id="u2">Preview as player</button>
  <p><button data-act="login" data-id="u1">Preview as leader</button> <button data-act="login" data-id="u9">Preview as admin</button></p>`
  : `<button class="pri" data-act="oauth">Log in with Discord</button>`}</div>`;
}

function render() {
  const app = $("app");
  if (!S.me) { app.innerHTML = (DEMO || S.ready) ? viewLogin() : "<main><p class=\"sub\">Loading…</p></main>"; return; }
  const r = S.route, tabs = [["player","Me"],["teams","Teams"]];
  if (!DEMO && S.guildInfo && S.guildInfo.leaderboard) tabs.push(["leaderboard","Leaderboard"]);
  if (lead(S.me.id)) tabs.push(["leader","Leader"]);
  if (S.me.admin) tabs.push(["admin","Admin"]);
  if (S.me.superadmin) tabs.push(["super","Super"]);
  let body = (!DEMO && !S.guilds.length && r !== "super") ? viewNoGuild() : r === "super" ? viewSuper() : r === "leaderboard" ? viewLeaderboard() : r === "teams" ? viewTeams() : r === "leader" ? viewLeader() : r === "admin" ? viewAdmin() : /^t\d+$/.test(r) ? viewTeam(r.slice(1)) : viewPlayer();
  app.innerHTML = `<header><div class="bar"><span class="brand">NEF Teams</span>${guildPicker()}<nav>${tabs.map(([k, l]) => `<a href="#${k}" class="${r === k || (k === "teams" && /^t\d+$/.test(r)) ? "on" : ""}">${l}</a>`).join("")}</nav>
  <span class="tag ok">${DEMO ? "preview" : "live"}</span><button data-act="logout">Log out</button></div></header><main>${DEMO ? `<div class="banner">Preview with sample data. Statistics shown here are placeholders, not real data.</div>` : ""}${body}</main>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, me = S.me;
  if (!DEMO && ["invite", "remove", "logout", "superact", "opengd"].includes(act)) return liveAct(act, b);
  if (act === "login") { S.me = S.users[b.dataset.id]; S.route = me ? S.route : "player"; render(); }
  else if (act === "oauth") location.href = CFG.API_BASE + "/auth/discord";
  else if (act === "logout") { S.me = null; render(); }
  else if (act === "invite") {
    const t = lead(me.id), v = $("inv").value.trim(); if (!t) return toast("Not authorized");
    if (!v) return toast("Enter a username");
    if (S.invites.some(i => i.team === t.id && i.user.toLowerCase() === v.toLowerCase() && i.status === "pending")) return toast("Duplicate pending invitation");
    S.invites.unshift({ id: "i" + Date.now(), team: t.id, user: v, by: me.id, status: "pending", exp: "in 24 h" });
    log(me.name + " invited " + v + " to " + t.name); render(); toast("Invitation created");
  } else if (act === "remove") {
    const t = lead(me.id), id = b.dataset.id; if (!t || !t.members.includes(id) || id === t.leader) return toast("Not authorized");
    t.members = t.members.filter(x => x !== id); log(me.name + " removed " + S.users[id].name + " from " + t.name); render(); toast("Player removed");
  } else if (act === "sim") {
    const d = S.teams.find(t => t.name === "Team Delta");
    if (d) { S.teams = S.teams.filter(t => t !== d); log("Role deleted: Team Delta"); } else { S.teams.push({ id: "1104", name: "Team Delta", leader: null, members: [] }); log("Role created: Team Delta"); }
    S.sync.last = "just now"; render(); toast("Discord event received");
  }
});
const route = () => { S.route = (location.hash || "#player").slice(1); if (S.me) render(); if (!DEMO && S.route === "super" && S.me && S.me.superadmin) loadSuper(); if (!DEMO && S.route === "leaderboard" && S.me) loadLeaderboard(); };
addEventListener("hashchange", route);

async function api(path, opts = {}) {
  const r = await fetch(CFG.API_BASE + path, { credentials: "include", ...opts,
    headers: { "X-Requested-With": "fetch", "Content-Type": "application/json" } });
  let data = null; try { data = await r.json(); } catch (e) {}
  return { status: r.status, ok: r.ok, data };
}
let es = null;
function connectLive() { // server-sent events: the server pings whenever Discord state changes
  if (es || !S.me) return;
  es = new EventSource(CFG.API_BASE + "/api/events", { withCredentials: true });
  es.onmessage = load;
  es.onerror = () => { if (es && es.readyState === 2) es = null; };
}
async function load() {
  try {
    const r = await api("/api/state");
    if (r.status === 401) { S.me = null; if (es) { es.close(); es = null; } }
    else if (r.ok) { Object.assign(S, r.data); connectLive(); }
  } catch (e) { toast("Connection problem"); }
  S.ready = true; render();
}
async function liveAct(act, b) {
  if (act === "logout") { await api("/auth/logout", { method: "POST", body: "{}" }); if (es) { es.close(); es = null; } S.me = null; render(); return; }
  const body = act === "invite" ? { username: $("inv").value.trim() } : { user_id: b.dataset.id };
  if (act === "invite" && !body.username) return toast("Enter a username");
  b.disabled = true;
  const r = await api("/api/leader/" + act, { method: "POST", body: JSON.stringify(body) });
  b.disabled = false;
  toast((r.data && (r.data.message || r.data.error)) || "Request failed");
  load();
}
const TOKEN_KEY = "nef_token", GUILD_KEY = "nef_guild";
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
function captureToken() { // the API redirects back here with #token=... (a fragment is never sent to any server)
  const m = location.hash.match(/^#token=([\w.\-]+)$/);
  if (m) { store.set(TOKEN_KEY, m[1]); history.replaceState(null, "", location.pathname + location.search); }
}
async function api(path, opts = {}) {
  const t = store.get(TOKEN_KEY);
  const r = await fetch(CFG.API_BASE + path, { ...opts, headers: { "Content-Type": "application/json", ...(t ? { Authorization: "Bearer " + t } : {}) } });
  let data = null; try { data = await r.json(); } catch (e) {}
  return { status: r.status, ok: r.ok, data };
}
let streamCtl = null;
async function startStream() { // live updates (server-sent events over fetch so the Authorization header can be used)
  if (streamCtl || !store.get(TOKEN_KEY)) return;
  const ctl = streamCtl = new AbortController();
  try {
    const r = await fetch(CFG.API_BASE + "/api/events", { headers: { Authorization: "Bearer " + store.get(TOKEN_KEY) }, signal: ctl.signal });
    if (!r.ok || !r.body) throw new Error("stream");
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const m = chunk.match(/^data: (.*)$/m);
        if (m) { const ids = m[1].split(","); if (ids.includes("*") || ids.includes(String(S.guild))) load(); }
      }
    }
  } catch (e) {}
  if (streamCtl === ctl) streamCtl = null;
  if (store.get(TOKEN_KEY)) setTimeout(startStream, 3000);
}
function stopStream() { if (streamCtl) { const c = streamCtl; streamCtl = null; c.abort(); } }
async function load() {
  try {
    const r = await api("/api/state" + (S.guild ? "?guild=" + encodeURIComponent(S.guild) : ""));
    if (r.status === 401) { store.set(TOKEN_KEY, null); S.me = null; stopStream(); }
    else if (r.ok) {
      const d = r.data;
      Object.assign(S, { me: d.me, users: d.users || {}, teams: d.teams || [], invites: d.invites || [], audit: d.audit || [], sync: d.sync || {}, guilds: d.guilds || [], guildInfo: d.guild || null, message: d.message || "", statdefs: d.statdefs || [] });
      if (d.guild) { S.guild = d.guild.id; store.set(GUILD_KEY, S.guild); }
      startStream();
      if (S.route === "super" && S.me && S.me.superadmin) loadSuper();
      if (S.route === "leaderboard") loadLeaderboard();
    }
  } catch (e) { toast("Connection problem"); }
  S.ready = true; render();
}
async function loadLeaderboard() {
  if (DEMO || !S.me || !S.guild) return;
  const q = new URLSearchParams({ guild: S.guild, limit: S.lbLimit });
  if (S.lbMetric) q.set("metric", S.lbMetric);
  if (S.lbTeam) q.set("team", S.lbTeam);
  const r = await api("/api/leaderboard?" + q);
  if (r.ok) { S.lb = r.data; S.lbMetric = r.data.metric; S.lbError = ""; }
  else { S.lb = null; S.lbError = (r.data && r.data.error) || "Could not load the leaderboard"; }
  if (S.route === "leaderboard") render();
}
async function loadSuper() { const r = await api("/api/super/overview"); if (r.ok) { S.super = r.data; render(); } }
async function liveAct(act, b) {
  if (act === "logout") { await api("/auth/logout", { method: "POST", body: "{}" }); store.set(TOKEN_KEY, null); stopStream(); S.me = null; render(); return; }
  if (act === "opengd") { S.guild = b.dataset.id; store.set(GUILD_KEY, S.guild); location.hash = "#player"; return load(); }
  if (act === "superact") {
    if (b.dataset.op === "leave" && !confirm("Remove the bot from this server? Its data stays in the database.")) return;
    b.disabled = true;
    const r = await api("/api/super/guild", { method: "POST", body: JSON.stringify({ guild_id: b.dataset.id, action: b.dataset.op }) });
    toast((r.data && (r.data.message || r.data.error)) || "Request failed");
    await loadSuper(); return load();
  }
  const body = act === "invite" ? { guild: S.guild, username: $("inv").value.trim() } : { guild: S.guild, user_id: b.dataset.id };
  if (act === "invite" && !body.username) return toast("Enter a username");
  b.disabled = true;
  const r = await api("/api/leader/" + act, { method: "POST", body: JSON.stringify(body) });
  b.disabled = false;
  toast((r.data && (r.data.message || r.data.error)) || "Request failed");
  load();
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "guildsel") { S.guild = t.value; store.set(GUILD_KEY, S.guild); S.lb = null; S.lbMetric = null; S.lbTeam = ""; S.lbError = ""; load(); }
  else if (t.id === "lbmetric") { S.lbMetric = t.value; loadLeaderboard(); }
  else if (t.id === "lbteam") { S.lbTeam = t.value; loadLeaderboard(); }
  else if (t.id === "lblimit") { S.lbLimit = +t.value; loadLeaderboard(); }
});
if (DEMO) { demoData(); route(); render(); }
else {
  captureToken(); S.guild = store.get(GUILD_KEY);
  route(); render(); load(); setInterval(load, 60000); /* safety net if an event is ever missed */
}
</script>
